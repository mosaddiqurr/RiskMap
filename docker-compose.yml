services:
  web:
    build: .
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      ANALYSIS_ALLOWED_ORIGINS: "${ANALYSIS_ALLOWED_ORIGINS:-http://127.0.0.1:3000,http://localhost:3000}"
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.mjs"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
